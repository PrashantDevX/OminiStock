spring.application.name=API-GATEWAY
server.port=8080

# JWT verification (must match AUTH-SERVICE configuration)
app.jwt.secret=${JWT_SECRET:OmniStockSecretKeyForJWTAuthentication2026VerySecure}
app.jwt.issuer=omnistock-auth

# Eureka service discovery + client side load balancing (lb://)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

logging.level.org.springframework.cloud.gateway=INFO
