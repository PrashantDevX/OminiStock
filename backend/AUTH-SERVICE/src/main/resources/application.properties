spring.application.name=AUTH-SERVICE
server.port=8081

# PostgreSQL - authentication database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnistock_auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:OmniStockSecretKeyForJWTAuthentication2026VerySecure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=omnistock-auth

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
